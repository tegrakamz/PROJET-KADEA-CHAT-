<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadea Chat - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-[440px] flex flex-col items-center">
        
        <div class="text-center mb-6 flex flex-col items-center">
            <div class="bg-[#2563eb] p-2.5 rounded-xl shadow-sm mb-3 w-12 h-12 flex items-center justify-center">
                <img src="assets/icons/logo chat-kadea.jfif" alt="logo chat-kadea" class="w-6 h-6 object-contain invert">
            </div>
            <h2 class="text-[#2563eb] text-2xl font-bold tracking-tight mb-1">Welcome back</h2>
            <p class="text-slate-400 text-sm">Please enter your details to sign in to Kadea Chat</p>
        </div>

        <form id="login-form" class="w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-4">
        
            <div id="message" class="hidden rounded-xl p-3 text-sm font-medium border"></div>

            <div>
                <label for="email" class="block text-slate-500 text-xs font-medium mb-1.5">Email Address</label>
                <div class="relative flex items-center">
                    <i data-lucide="mail" class="absolute left-3.5 text-slate-400 w-4 h-4 pointer-events-none"></i>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required
                        class="w-full bg-[#f0f4ff]/60 border border-transparent rounded-xl py-3 px-10 text-sm text-slate-800 outline-none transition-all focus:border-[#2563eb] focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                </div>
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-slate-500 text-xs font-medium">Password</label>
                    <a href="#" class="text-[#2563eb] text-xs font-medium hover:underline">Forgot?</a>
                </div>
                <div class="relative flex items-center">
                    <i data-lucide="lock" class="absolute left-3.5 text-slate-400 w-4 h-4 pointer-events-none"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        class="w-full bg-[#f0f4ff]/60 border border-transparent rounded-xl py-3 px-10 text-sm text-slate-800 outline-none transition-all focus:border-[#2563eb] focus:bg-white focus:ring-4 focus:ring-blue-500/10">
                    <i data-lucide="eye" id="toggle-password" class="absolute right-3.5 text-slate-400 w-4 h-4 cursor-pointer hover:text-slate-600"></i>
                </div>
                
            </div>
            
            <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded border-slate-300 text-[#2563eb] focus:ring-[#2563eb]/20 accent-[#2563eb]">
                <label for="remember" class="text-xs text-slate-500 select-none">Keep me signed in</label>
            </div>
            
            <button type="submit" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl text-sm transition-colors !mt-6 flex justify-center items-center gap-2">
                <span>Login</span>
            </button>
        </form>

        <p class="text-sm text-slate-500 text-center mt-6">
            Don't have an account? <a href="register.html" class="text-[#2563eb] font-medium hover:underline">Create Account</a>
        </p>
    </main>

    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="assets/js/auth/login.js"></script>
</body>
</html>
